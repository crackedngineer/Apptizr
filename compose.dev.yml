services:
  platform:
    image: platform
    build:
      context: ./web
      dockerfile: ./web/Dockerfile
    volumes:
      - ./web/:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
  
  apps:
    image: apps
    build: 
      context: ./src
      dockerfile: ./src/Dockerfile
    ports:
      - 8501:8501
      - 7860:7860
    